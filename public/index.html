<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Connect - Real-Time Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .box { border: 1px solid #ccc; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    input, button { padding: 0.5rem; font-size: 0.95rem; }
    input { flex: 1; }
    #messages { height: 260px; overflow-y: auto; border: 1px solid #ddd; padding: 0.75rem; background: #fafafa; }
    .msg { margin-bottom: 0.4rem; }
    .note { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h2>Secure Connect Chat Demo</h2>

  <div class="box">
    <div class="row">
      <input id="email" type="email" placeholder="Email (for quick login)" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Login &amp; Get Token</button>
    </div>
    <div class="row">
      <input id="token" type="text" placeholder="Paste JWT token here..." />
      <button id="connectBtn">Connect Socket</button>
    </div>
    <div id="status">Status: Disconnected</div>
  </div>

  <div class="box">
    <div id="messages"></div>
    <div class="row" style="margin-top: 0.75rem;">
      <input id="msgInput" type="text" placeholder="Type a message..." disabled />
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null;

    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const tokenInput = document.getElementById('token');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendLine(text, isNotice = false) {
      const div = document.createElement('div');
      div.className = isNotice ? 'msg note' : 'msg';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok && data.token) {
        tokenInput.value = data.token;
        statusEl.textContent = `Logged in as ${data.user.username}. Click Connect Socket.`;
      } else {
        statusEl.textContent = `Login failed: ${data.message || res.status}`;
      }
    });

    document.getElementById('connectBtn').addEventListener('click', () => {
      const token = tokenInput.value.trim();
      if (socket) socket.disconnect();

      socket = io({ auth: { token } });

      socket.on('connect', () => {
        statusEl.textContent = `Status: Connected (${socket.id})`;
        msgInput.disabled = false;
        sendBtn.disabled = false;
      });

      socket.on('connect_error', (err) => {
        statusEl.textContent = `Connection rejected: ${err.message}`;
        msgInput.disabled = true;
        sendBtn.disabled = true;
      });

      socket.on('chat:notification', (data) => {
        appendLine(`[${data.timestamp}] * ${data.message}`, true);
      });

      socket.on('chat:message', (data) => {
        appendLine(`[${data.timestamp}] ${data.sender}: ${data.text}`);
      });

      socket.on('disconnect', () => {
        statusEl.textContent = 'Status: Disconnected';
        msgInput.disabled = true;
        sendBtn.disabled = true;
      });
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text || !socket) return;
      socket.emit('chat:message', text);
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
